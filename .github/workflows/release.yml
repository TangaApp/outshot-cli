name: Release

# Publishes to npm when a version tag (v0.2.0) is pushed. npm's trusted publishing lets this
# workflow publish without any stored token; once the repository is public, npm also adds
# provenance (which commit built it) by itself.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1 or later (trusted publishing)
        run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      - name: The tag matches package.json, and is on main
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm test
      - run: npm publish --access public
